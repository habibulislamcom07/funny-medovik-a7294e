[build]
  publish = "."

# Clean URL redirects for pilot tools (/tool-name -> /tools/tool-name/)
[[redirects]]
  from = "/age-calculator"
  to = "/tools/age-calculator/"
  status = 301

[[redirects]]
  from = "/emi-calculator"
  to = "/tools/emi-calculator/"
  status = 301

[[redirects]]
  from = "/bmi-calculator"
  to = "/tools/bmi-calculator/"
  status = 301

[[redirects]]
  from = "/percentage-calculator"
  to = "/tools/percentage-calculator/"
  status = 301

[[redirects]]
  from = "/gst-calculator"
  to = "/tools/gst-calculator/"
  status = 301

# General trailing slash redirect for all tools
[[redirects]]
  from = "/tools/:tool"
  to = "/tools/:tool/"
  status = 301

# HTTP Security & Cache Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
